<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="{{ .Title }} — apollo docs" />
<title>{{ .Title }} — apollo</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link href="https://cdn.jsdelivr.net/npm/@fontsource/iosevka@latest/400.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/@fontsource/iosevka@latest/500.css" rel="stylesheet" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='white'/%3E%3Cpath d='M24 6 L36 19 L24 32 L12 19 Z' fill='%23a3e635'/%3E%3Cpath d='M24 6 L24 32 M12 19 L36 19' stroke='%234d7c0f' stroke-width='2'/%3E%3C/svg%3E" />
<style>
:root{--bg:#000;--text:#ededed;--muted:#a1a1aa;--faint:#71717a;--border:#1f1f23;--code-bg:#0d0d0f}
[data-theme="light"]{--bg:#fff;--text:#111;--muted:#52525b;--faint:#a1a1aa;--border:#e9e9ec;--code-bg:#f4f4f5}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--muted);font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;font-size:15.5px;line-height:1.75;-webkit-font-smoothing:antialiased}
.wrap{max-width:660px;margin:0 auto;padding:0 1.25rem}
.topbar{display:flex;align-items:center;justify-content:center;gap:1.4rem;padding:.9rem 1rem;font-size:.85rem;position:relative;max-width:900px;margin:0 auto}
.topbar a.nl{color:var(--muted);text-decoration:none}
.topbar a.nl:hover{color:var(--text)}
.top-actions{position:absolute;right:1rem;display:flex;align-items:center;gap:.7rem}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--muted);padding:.25rem;display:flex;align-items:center}
.icon-btn svg{display:block}
.back svg{flex-shrink:0}
.back{display:inline-flex;align-items:center;gap:.35rem}
.icon-btn:hover{color:var(--text)}
.back{font-size:.85rem;color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:.35rem}
.back svg{width:14px;height:14px}
.back:hover{color:var(--text)}
.prose{padding:2.5rem 0}
.prose h1{color:var(--text);font-size:1.6rem;letter-spacing:-.02em;margin:.75rem 0 1rem}
.prose h2{color:var(--text);font-size:1.15rem;margin:2em 0 .4em}
.prose p{margin:.8em 0}
.prose ul,.prose ol{margin:.8em 0 .8em 1.4em}
.prose li{margin:.3em 0}
.prose a{color:var(--text);text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px}
.prose table{width:100%;border-collapse:collapse;margin:1.2em 0;font-size:.85rem;display:block;overflow-x:auto}
.prose th,.prose td{border:1px solid var(--border);padding:.5rem .75rem;text-align:left}
.prose th{color:var(--text)}
.prose code{font-family:'Iosevka',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em}
/* syntax highlighting (prism) */
code[class*=language-]{font-family:'Iosevka',ui-monospace,Menlo,monospace}
.token.comment,.token.prolog,.token.cdata{color:var(--faint);font-style:italic}
.token.keyword,.token.tag,.token.selector,.token.attr-name,.token.builtin{color:#c4b5fd}
.token.string,.token.char,.token.attr-value,.token.regex{color:#eab308}
.token.function,.token.class-name{color:var(--text)}
.token.number,.token.boolean,.token.constant{color:#fb923c}
.token.operator,.token.punctuation{color:var(--faint)}
.token.important,.token.bold{font-weight:700}
[data-theme=light] .token.keyword,[data-theme=light] .token.tag{color:#6d28d9}
[data-theme=light] .token.string,[data-theme=light] .token.attr-value{color:#a16207}
[data-theme=light] .token.number,[data-theme=light] .token.boolean{color:#ea580c}
.prose :not(pre)>code{background:var(--code-bg);color:var(--text);padding:.12em .38em;border-radius:6px}
.prose pre{background:var(--code-bg);border:1px solid var(--border);border-radius:12px;padding:1rem 1.2rem;overflow:auto;font-size:.82rem;line-height:1.8;margin:1.2em 0}
.prose blockquote{border-left:2px solid var(--faint);padding-left:1rem;margin:1.2em 0;color:var(--text)}
.toc{position:fixed;top:7rem;left:max(1.25rem,calc(50vw - 330px - 210px));width:180px;margin:0;max-height:calc(100vh - 10rem);overflow-y:auto}
.toc-title{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:.7rem}
.toc ul{list-style:none;margin:0;padding:0;position:relative}
.toc ul::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1px;background:var(--border)}
.toc li{margin:0}
.toc a{display:block;font-size:.8rem;color:var(--faint);text-decoration:none;padding:.28rem 0 .28rem .95rem;line-height:1.4;transition:color .15s}
.toc a:hover{color:var(--text)}
.toc a.active{color:var(--text)}
/* sliding indicator */
.toc-ind{position:absolute;left:0;top:0;width:2px;height:0;margin:0;padding:0;list-style:none;background:var(--text);border-radius:1px;transition:transform .25s cubic-bezier(.4,0,.2,1),height .25s cubic-bezier(.4,0,.2,1);transform:translateY(0);will-change:transform,height}
/* mobile: back to a regular block above the content */
@media(max-width:1100px){.toc{position:static;width:auto;max-height:none;overflow:visible;background:var(--code-bg);border:1px solid var(--border);border-radius:12px;padding:.9rem 1.2rem;margin:0 0 1.5rem}.toc ul::before{display:none}.toc a{padding:.2rem 0}.toc-ind{display:none}}
footer{border-top:1px solid var(--border);margin-top:3rem;padding:1.5rem 0 2.5rem;font-size:.78rem;color:var(--faint)}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem}

/* view transitions */
@view-transition{navigation:auto}
::view-transition-old(root){animation:vt-fade-out .28s ease both}
::view-transition-new(root){animation:vt-fade-in .28s ease both}
@keyframes vt-fade-out{to{opacity:0}}
@keyframes vt-fade-in{from{opacity:0}}
html[data-vt-nav="traverse"]::view-transition-old(root){animation:vt-back-out .38s cubic-bezier(.3,.7,.3,1) both}
@keyframes vt-back-out{to{opacity:0;transform:translateX(-72px)}}
/* circular theme reveal expanding from the toggle */
html[data-vt="theme"]::view-transition-old(root),html[data-vt="theme"]::view-transition-new(root){animation:none;mix-blend-mode:normal}
html[data-vt="theme"]::view-transition-new(root){z-index:2;clip-path:circle(0 at var(--vt-x) var(--vt-y));animation:vt-circle .6s cubic-bezier(.3,.7,.3,1) forwards}
@keyframes vt-circle{to{clip-path:circle(var(--vt-r) at var(--vt-x) var(--vt-y))}}
/* home entrance */
.rise{animation:vt-rise .65s cubic-bezier(.2,.7,.2,1) both}
.rise-1{animation-delay:.06s}.rise-2{animation-delay:.12s}.rise-3{animation-delay:.18s}
html.from-vt .rise{animation:none}
@keyframes vt-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){@view-transition{navigation:none}*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}html{scroll-behavior:auto}}

/* scroll reveals (below-fold blocks; gated on html.js so no-JS stays visible) */
html.js .rv{opacity:0;transform:translateY(16px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
html.js .rv.in{opacity:1;transform:none}
/* docs entrance: fade+rise normally, slide-from-right on back/forward without VT */
.prose{animation:vt-doc-in .45s cubic-bezier(.2,.7,.2,1) backwards}
html.from-vt .prose{animation:none}
html.traverse .prose{animation:vt-doc-back .4s cubic-bezier(.3,.7,.3,1) backwards}
@keyframes vt-doc-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes vt-doc-back{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="topbar">
<a class="nl" href="../">Home</a>
<a class="nl" href="../#docs">Docs</a>
<a class="nl" href="https://github.com/HimanshuSardana/kite" target="_blank" rel="noreferrer">GitHub</a>
<div class="top-actions">
<button class="icon-btn" id="theme-toggle" aria-label="Toggle theme"><svg id="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg id="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
</div>
</div>
<div class="wrap">
{{ if .TOC }}
<nav class="toc"><span class="toc-title">On this page</span>
<ul><span class="toc-ind" id="toc-ind" aria-hidden="true"></span>{{ range .TOC }}<li><a href="#{{ .ID }}">{{ .Text }}</a></li>{{ end }}</ul>
</nav>
{{ end }}
<main class="prose">
<a class="back" href="../"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg> apollo</a>
<h1>{{ .Title }}</h1>
{{ .Content }}
</main>
<footer><div class="wrap"><span>© {{ .Year }} Himanshu Sardana</span><span>built with kite</span></div></footer>
</div>
<script>
(function(){
  var btn = document.getElementById('theme-toggle');
  var saved = null;
  try { saved = localStorage.getItem('kite-theme'); } catch(e) {}
  if (saved) { document.documentElement.setAttribute('data-theme', saved); }
  function sync(){
    var light = document.documentElement.getAttribute('data-theme') === 'light';
    document.getElementById('icon-sun').style.display = light ? 'none' : 'block';
    document.getElementById('icon-moon').style.display = light ? 'block' : 'none';
  }
  sync();
  btn.addEventListener('click', function(e){
    var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    function flip(){
      if (next === 'dark') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('kite-theme', next); } catch(e) {}
      sync();
    }
    if (document.startViewTransition) {
      var x = (e && e.clientX != null) ? e.clientX : window.innerWidth / 2;
      var y = (e && e.clientY != null) ? e.clientY : 0;
      var root = document.documentElement;
      var r = Math.hypot(Math.max(x, window.innerWidth - x), Math.max(y, window.innerHeight - y));
      root.style.setProperty('--vt-x', Math.round(x) + 'px');
      root.style.setProperty('--vt-y', Math.round(y) + 'px');
      root.style.setProperty('--vt-r', Math.ceil(r) + 'px');
      root.dataset.vt = 'theme';
      var t = document.startViewTransition(flip);
      if (t && t.finished) {
        t.finished.then(function(){ delete root.dataset.vt; }, function(){ delete root.dataset.vt; });
      }
    } else { flip(); }
  });
})();
// cross-document transitions: slide the old page out on back/forward,
// and skip the home rise-in when arriving through a transition
window.addEventListener('pageswap', function(e){
  if (!e.viewTransition) return;
  var nav = (e.activation && e.activation.navigationType) || '';
  if (nav) document.documentElement.dataset.vtNav = nav;
});
function markNav(){
  var root = document.documentElement;
  if (root.classList.contains('from-vt')) return;
  try {
    if (performance.navigation && performance.navigation.type === 2) root.classList.add('traverse');
  } catch(e) {}
}
window.addEventListener('pagereveal', function(e){
  if (e.viewTransition) document.documentElement.classList.add('from-vt');
  else markNav();
});
document.addEventListener('DOMContentLoaded', markNav);
</script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js" data-autoloader-path="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/"></script>
<script>
// TOC scrollspy: measure the real link box and slide the left indicator there.
(function(){
  var toc = document.querySelector('.toc');
  if (!toc) return;
  var ind = document.getElementById('toc-ind');
  var links = Array.prototype.slice.call(toc.querySelectorAll('a'));
  if (!ind || !links.length) return;

  var headings = links.map(function(a){
    return document.getElementById(a.getAttribute('href').slice(1));
  });

  function onMobile(){ return window.matchMedia('(max-width: 1100px)').matches; }

  // Align the indicator with the *text* of a link, not its padded box.
  function place(a){
    if (!a || onMobile()) { ind.style.height = '0px'; return; }
    var cs = getComputedStyle(a);
    var padTop = parseFloat(cs.paddingTop) || 0;
    var padBottom = parseFloat(cs.paddingBottom) || 0;
    var lh = parseFloat(cs.lineHeight);
    if (!lh || isNaN(lh)) lh = parseFloat(cs.fontSize) * 1.4;
    var lines = Math.max(1, Math.round((a.clientHeight - padTop - padBottom) / lh));
    var textH = lines * lh;

    var top = a.offsetTop + padTop;
    ind.style.height = Math.round(textH) + 'px';
    ind.style.transform = 'translateY(' + Math.round(top) + 'px)';
  }

  var ticking = false;
  function onScroll(){
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function(){
      ticking = false;
      if (!headings.length) return;
      var marker = window.scrollY + Math.min(window.innerHeight * 0.32, 220);
      var best = 0, bestDist = -Infinity;
      for (var i = 0; i < headings.length; i++) {
        var h = headings[i];
        if (!h) continue;
        var top = h.getBoundingClientRect().top + window.scrollY - marker;
        if (top <= 0 && top > bestDist) { bestDist = top; best = i; }
      }
      for (var j = 0; j < links.length; j++) links[j].classList.toggle('active', j === best);
      place(links[best]);
    });
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(onScroll);
  window.addEventListener('load', onScroll);
  onScroll();
})();
</script>
</body>
</html>
