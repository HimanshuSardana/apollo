[package]
name = "apollo-cli"
version = "0.1.0"
edition = "2021"
description = "Apollo terminal client (TUI chat loop)."

[[bin]]
name = "apollo"
path = "src/main.rs"

[features]
default = ["full"]
# Mirrors apollo-core tools so `cargo build -p apollo-cli --no-default-features --features tool-read,tool-bash`
# yields a minimal binary. The future wizard will generate exactly this flag set.
tool-read = ["apollo-core/tool-read"]
tool-write = ["apollo-core/tool-write"]
tool-edit = ["apollo-core/tool-edit"]
tool-bash = ["apollo-core/tool-bash"]
full-tools = ["tool-read", "tool-write", "tool-edit", "tool-bash"]
mcp = ["apollo-core/mcp"]
subagents = ["apollo-core/subagents"]
plan-mode = ["apollo-core/plan-mode"]
full = ["full-tools", "mcp", "subagents", "plan-mode"]

[dependencies]
apollo-core = { path = "../apollo-core" }
crossterm = { version = "0.29.0", default-features = false, features = ["events"] }
owo-colors = "4"
rustyline = { version = "19.0.0", default-features = false, features = ["with-file-history"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }
unicode-width = "0.2.2"
