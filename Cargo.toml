[package]
name = "apollo"
version = "0.1.0"
edition = "2021"

[dependencies]
owo-colors = "4"
reqwest = { version = "0.12", features = ["json"] }
rustyline = "19.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }
unicode-width = "0.2.2"
uuid = { version = "1", features = ["v4"] }
