[package]
name = "apollo"
version = "0.1.0"
edition = "2021"

[dependencies]
crossterm = "0.28"
owo-colors = "4"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }
uuid = { version = "1", features = ["v4"] }
