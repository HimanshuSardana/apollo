[workspace]
members = ["crates/apollo-core", "crates/apollo-cli", "crates/apollo-gui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

# Shared release tuning: smallest binaries. Per-crate overrides go in crates/*/Cargo.toml.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
