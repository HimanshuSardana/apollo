[package]
name = "apollo"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[dependencies]
crossterm = { version = "0.29.0", default-features = false, features = ["events"] }
owo-colors = "4"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "default-tls"] }
rustyline = { version = "19.0.0", default-features = false, features = ["with-file-history"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }
unicode-width = "0.2.2"
